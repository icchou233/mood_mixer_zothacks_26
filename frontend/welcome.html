
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moodmixer | Find Your Sound</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Gloock&family=Maname&family=Chewy&family=Coiny&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Your CSS -->
    <link rel="stylesheet" href="test_website.css">

    <!-- Alpine Intersect Plugin -->
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/intersect@3.x.x/dist/cdn.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        [x-cloak] {
            display: none !important;
        }

        :root {
            --moodmixer-header-height: 84px;
        }

        /* Entire page beneath the fixed header */
        .moodmixer-layout {
            display: grid;
            grid-template-columns: 1fr;
            margin-top: var(--moodmixer-header-height);
            min-height: calc(100dvh - var(--moodmixer-header-height));
            width: 100%;
        }

        /* Slideshow without outside margins */
        .moodmixer-slideshow {
            position: relative;
            width: 100%;
            height: clamp(320px, 44dvh, 480px);
            overflow: hidden;
            border-radius: 0;
        }

        /* Welcome form */
        .moodmixer-form-panel {
            display: flex;
            min-width: 0;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }

        /* Desktop: 40% slideshow, 60% welcome */
        @media (min-width: 1024px) {

            .moodmixer-layout {
                grid-template-columns: 40% 60%;
                height: calc(100dvh - var(--moodmixer-header-height));
                min-height: 0;
            }

            .moodmixer-slideshow {
                height: 100%;
            }

            .moodmixer-form-panel {
                min-height: 0;
                overflow-y: auto;
                padding: 2rem 3rem;
            }
        }
        /* Larger screens: no page scrolling */
        @media (min-width: 1024px) and (min-height: 700px) {
            html, body {
                height: 100%;
                margin: 0;
                overflow: hidden;
            }
        }

        /* Smaller screens: allow scrolling */
        @media (max-width: 1023px), (max-height: 699px) {
            html, body {
                height: auto;
                margin: 0;
                overflow-x: hidden;
                overflow-y: auto;
            }

            .moodmixer-layout {
                height: auto;
                min-height: calc(100dvh - var(--moodmixer-header-height));
            }

            .moodmixer-form-panel {
                overflow-y: visible;
            }

            .moodmixer-slideshow {
                height: clamp(320px, 44dvh, 480px);
            }
}
    </style>
</head>

<body
    x-data="welcomeApp()"
    class="bg-[#FFF5CC] text-[#33415c]"
>

    <!-- FIXED HEADER -->
    <header
        x-ref="siteHeader"
        class="fixed inset-x-0 top-0 z-50 w-full
               bg-[#1e293b] text-[#DCEBFA] shadow-lg"
    >

        <div
            class="flex w-full flex-wrap items-center
                   justify-between gap-3 px-4 py-4 sm:px-6"
        >

            <!-- MOODMIXER LOGO -->
            <a
                href="welcome.html"
                class="flex items-center gap-2"
            >

                <span
                    class="grid h-9 w-9 place-items-center
                           rounded-full bg-[#2a6f97] text-xl"
                >
                    ♫
                </span>

                <span
                    class="text-2xl sm:text-3xl"
                    style="font-family: 'Coiny', cursive;"
                >
                    Moodmixer
                </span>

            </a>


            <!-- GENRE AND ERA FILTERS -->
            <nav class="flex w-full flex-wrap items-center gap-3 sm:w-auto">

                <!-- GENRE DROPDOWN -->
                <div class="relative min-w-[145px] flex-1 sm:flex-none">

                    <button
                        type="button"
                        @click="genreOpen = !genreOpen; eraOpen = false"
                        :aria-expanded="genreOpen.toString()"
                        class="flex w-full items-center justify-between
                               gap-4 rounded-lg border border-[#50657c]
                               bg-[#33415c] px-4 py-2.5 text-left
                               hover:bg-[#2a6f97]"
                    >

                        <span
                            x-text="selectedGenres.length
                                ? 'Genres (' + selectedGenres.length + ')'
                                : 'Genres'"
                        ></span>

                        <svg width="14" height="14" viewBox="0 0 24 24">
                            <path
                                d="M5 9 L12 16 L19 9"
                                stroke="currentColor"
                                stroke-width="2.5"
                                fill="none"
                            />
                        </svg>

                    </button>


                    <!-- GENRE OPTIONS -->
                    <div
                        x-show="genreOpen"
                        x-cloak
                        x-transition
                        @click.outside="genreOpen = false"
                        @keydown.escape.window="genreOpen = false"
                        class="absolute right-0 top-full z-50 mt-2
                               max-h-72 w-64 overflow-y-auto rounded-xl
                               border border-[#50657c] bg-[#1e293b]
                               p-2 shadow-xl"
                    >

                        <div class="flex items-center justify-between px-2 py-2">

                            <span class="text-xs text-[#b8cfdf]">
                                Choose one or more
                            </span>

                            <button
                                type="button"
                                @click="selectedGenres = []"
                                class="text-xs underline"
                            >
                                Clear
                            </button>

                        </div>

                        <template
                            x-for="genre in genreOptions"
                            :key="genre"
                        >

                            <label
                                class="flex cursor-pointer items-center
                                       gap-3 rounded-lg px-3 py-2
                                       text-sm hover:bg-[#33415c]"
                            >

                                <input
                                    type="checkbox"
                                    x-model="selectedGenres"
                                    :value="genre"
                                    class="h-4 w-4 accent-[#2a6f97]"
                                >

                                <span x-text="genre"></span>

                            </label>

                        </template>

                    </div>
                </div>


                <!-- ERA DROPDOWN -->
                <div class="relative min-w-[130px] flex-1 sm:flex-none">

                    <button
                        type="button"
                        @click="eraOpen = !eraOpen; genreOpen = false"
                        :aria-expanded="eraOpen.toString()"
                        class="flex w-full items-center justify-between
                               gap-4 rounded-lg border border-[#50657c]
                               bg-[#33415c] px-4 py-2.5 text-left
                               hover:bg-[#2a6f97]"
                    >

                        <span
                            x-text="selectedEras.length
                                ? 'Eras (' + selectedEras.length + ')'
                                : 'Eras'"
                        ></span>

                        <svg width="14" height="14" viewBox="0 0 24 24">
                            <path
                                d="M5 9 L12 16 L19 9"
                                stroke="currentColor"
                                stroke-width="2.5"
                                fill="none"
                            />
                        </svg>

                    </button>


                    <!-- ERA OPTIONS -->
                    <div
                        x-show="eraOpen"
                        x-cloak
                        x-transition
                        @click.outside="eraOpen = false"
                        @keydown.escape.window="eraOpen = false"
                        class="absolute right-0 top-full z-50 mt-2
                               max-h-72 w-48 overflow-y-auto rounded-xl
                               border border-[#50657c] bg-[#1e293b]
                               p-2 shadow-xl"
                    >

                        <div class="flex items-center justify-between px-2 py-2">

                            <span class="text-xs text-[#b8cfdf]">
                                Release decade
                            </span>

                            <button
                                type="button"
                                @click="selectedEras = []"
                                class="text-xs underline"
                            >
                                Clear
                            </button>

                        </div>

                        <template
                            x-for="era in eraOptions"
                            :key="era"
                        >

                            <label
                                class="flex cursor-pointer items-center
                                       gap-3 rounded-lg px-3 py-2
                                       text-sm hover:bg-[#33415c]"
                            >

                                <input
                                    type="checkbox"
                                    x-model="selectedEras"
                                    :value="era"
                                    class="h-4 w-4 accent-[#2a6f97]"
                                >

                                <span x-text="era"></span>

                            </label>

                        </template>

                    </div>
                </div>

            </nav>
        </div>
    </header>



    <!-- MAIN PAGE -->
    <main class="moodmixer-layout">


        <!-- LEFT: FULL-HEIGHT SLIDESHOW -->
        <section
            aria-label="Seven moods slideshow"
            aria-roledescription="carousel"
            class="moodmixer-slideshow isolate bg-[#33415c]"
        >

            <!-- SLIDE IMAGES -->
            <template
                x-for="(slide, index) in slides"
                :key="slide.title"
            >

                <div
                    x-show="currentSlide === index"
                    x-cloak
                    x-transition:enter="transition-opacity duration-700 ease-in-out"
                    x-transition:enter-start="opacity-0"
                    x-transition:enter-end="opacity-100"
                    x-transition:leave="transition-opacity duration-700 ease-in-out"
                    x-transition:leave-start="opacity-100"
                    x-transition:leave-end="opacity-0"
                    :style="'background: ' + slide.gradient"
                    class="absolute inset-0"
                >

                    <!-- Background Image -->
                    <img
                        :src="slide.image"
                        :alt="slide.alt"
                        :loading="index === 0 ? 'eager' : 'lazy'"
                        @error="$el.style.display = 'none'"
                        class="absolute inset-0 h-full w-full object-cover"
                    >

                    <!-- Dark overlay for readable text -->
                    <div
                        class="absolute inset-0 bg-gradient-to-t
                               from-slate-950/90 via-slate-900/20
                               to-slate-950/10"
                    ></div>

                    <!-- Mood Description -->
                    <div
                        class="absolute bottom-20 left-6 right-6
                               text-white sm:left-8 sm:right-8"
                    >

                        <p
                            x-text="'Mood ' + (index + 1) + ' / ' + slides.length"
                            class="mb-2 text-xs font-semibold
                                   uppercase tracking-[0.3em]
                                   text-white/80"
                        ></p>

                        <h2
                            x-text="slide.title"
                            class="text-4xl sm:text-5xl"
                            style="font-family: 'Gloock', serif;"
                        ></h2>

                        <p
                            x-text="slide.caption"
                            class="mt-3 max-w-xs text-sm
                                   leading-relaxed text-white/90
                                   sm:text-base"
                        ></p>

                    </div>

                </div>

            </template>



            <!-- CENTERED SLIDESHOW ARROWS -->
            <div
                class="pointer-events-none absolute inset-0 z-20
                       flex items-center justify-between px-3 sm:px-5"
            >

                <!-- LEFT ARROW -->
                <button
                    type="button"
                    @click="previousSlide()"
                    aria-label="Previous mood"
                    class="pointer-events-auto flex h-11 w-11 shrink-0
                           items-center justify-center rounded-full
                           bg-slate-950/50 text-white shadow-md
                           backdrop-blur-sm transition
                           hover:bg-slate-950/75 sm:h-12 sm:w-12"
                >

                    <svg
                        width="22"
                        height="22"
                        viewBox="0 0 24 24"
                        fill="none"
                    >

                        <path
                            d="M15 18L9 12L15 6"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>

                </button>


                <!-- RIGHT ARROW -->
                <button
                    type="button"
                    @click="nextSlide()"
                    aria-label="Next mood"
                    class="pointer-events-auto flex h-11 w-11 shrink-0
                           items-center justify-center rounded-full
                           bg-slate-950/50 text-white shadow-md
                           backdrop-blur-sm transition
                           hover:bg-slate-950/75 sm:h-12 sm:w-12"
                >

                    <svg
                        width="22"
                        height="22"
                        viewBox="0 0 24 24"
                        fill="none"
                    >

                        <path
                            d="M9 18L15 12L9 6"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>

                </button>

            </div>



            <!-- NAVIGATION DOTS -->
            <div
                class="absolute bottom-5 left-0 right-0 z-20
                       flex items-center justify-center gap-2.5"
            >

                <template
                    x-for="(slide, index) in slides"
                    :key="'dot-' + slide.title"
                >

                    <button
                        type="button"
                        @click="goToSlide(index)"
                        :aria-label="'Show ' + slide.title"
                        :aria-pressed="(currentSlide === index).toString()"
                        :class="currentSlide === index
                            ? 'w-7 bg-white'
                            : 'w-2.5 bg-white/50 hover:bg-white/90'"
                        class="h-2.5 rounded-full
                               transition-all duration-300"
                    ></button>

                </template>

            </div>

        </section>



        <!-- RIGHT: WELCOME FORM -->
        <section class="moodmixer-form-panel">

            <div
                x-intersect.once="visible = true"
                :class="visible ? 'opacity-100' : 'opacity-0'"
                class="w-full max-w-2xl text-center
                       transition-opacity duration-700"
            >

                <!-- Welcome -->
                <h1 class="playlist-heading mb-4 text-5xl sm:text-6xl">
                    Welcome!
                </h1>

                <p class="mb-10 text-[#33415c]">
                    Tell us how you're feeling.
                </p>


                <!-- DESCRIPTION / MOOD -->
                <div class="flex flex-col items-center gap-4 md:flex-row">

                    <!-- Description -->
                    <input
                        type="text"
                        x-model="description"
                        placeholder="Describe your mood..."
                        class="w-full min-w-0 flex-1
                               rounded-lg bg-[#1e293b]
                               px-4 py-3 text-white
                               placeholder:text-[#DCEBFA]"
                    >

                    <!-- OR -->
                    <span class="text-lg font-bold text-[#33415c]">
                        |
                    </span>


                    <!-- Mood Dropdown -->
                    <div class="relative w-full min-w-0 flex-1">

                        <select
                            x-model="mood"
                            class="w-full cursor-pointer appearance-none
                                   rounded-lg bg-[#1e293b]
                                   px-4 py-3 pr-10 text-[#DCEBFA]"
                        >

                            <option value="">Select a mood</option>
                            <option value="Late-Night Drives">Late-Night Drives</option>
                            <option value="Rainy Days">Rainy Days</option>
                            <option value="Nostalgic">Nostalgic</option>
                            <option value="Getting Ready">Getting Ready</option>
                            <option value="Workout Mix">Workout Mix</option>
                            <option value="Deep Focus">Deep Focus</option>
                            <option value="Carpool Karaoke">Carpool Karaoke</option>
                            <option value="Party Hits">Party Hits</option>
                            <option value="Date Night">Date Night</option>

                        </select>


                        <!-- Dropdown Triangle -->
                        <svg
                            class="pointer-events-none absolute right-4
                                   top-1/2 -translate-y-1/2"
                            width="14"
                            height="14"
                            viewBox="0 0 24 24"
                        >
                            <path
                                d="M5 8 L19 8 L12 16 Z"
                                fill="#DCEBFA"
                            />
                        </svg>

                    </div>
                </div>



                <!-- NUMBER OF SONGS -->
                <div class="mt-8 flex items-center justify-center gap-4">

                    <label
                        for="songCount"
                        class="font-medium text-[#33415c]"
                    >
                        # of songs
                    </label>


                    <div class="relative">

                        <select
                            id="songCount"
                            x-model.number="songCount"
                            class="cursor-pointer appearance-none
                                   rounded-lg bg-[#1e293b]
                                   px-4 py-3 pr-10 text-[#DCEBFA]"
                        >

                            <option value="5">5</option>
                            <option value="10">10</option>
                            <option value="15">15</option>
                            <option value="20">20</option>

                        </select>


                        <svg
                            class="pointer-events-none absolute right-3
                                   top-1/2 -translate-y-1/2"
                            width="14"
                            height="14"
                            viewBox="0 0 24 24"
                        >
                            <path
                                d="M5 8 L19 8 L12 16 Z"
                                fill="#DCEBFA"
                            />
                        </svg>

                    </div>
                </div>



                <!-- SELECTED FILTERS -->
                <p
                    x-show="selectedGenres.length || selectedEras.length"
                    x-cloak
                    class="mt-4 text-sm text-[#33415c]"
                >

                    <span
                        x-text="selectedGenres.length
                            ? 'Genres: ' + selectedGenres.join(', ')
                            : 'All genres'"
                    ></span>

                    ·

                    <span
                        x-text="selectedEras.length
                            ? 'Eras: ' + selectedEras.join(', ')
                            : 'All eras'"
                    ></span>

                </p>



                <!-- GENERATE BUTTON -->
                <button
                    type="button"
                    @click="generate()"
                    :disabled="loading || generated"
                    class="mt-12 cursor-pointer rounded-xl
                           bg-[#1e293b] px-10 py-4
                           font-semibold text-[#DCEBFA]
                           transition hover:bg-[#2a6f97]
                           disabled:cursor-not-allowed
                           disabled:opacity-50"
                >

                    <span
                        x-text="loading
                            ? 'Generating...'
                            : 'Generate Playlists'"
                    ></span>

                </button>


                <!-- Success Message -->
                <p
                    x-show="generated"
                    x-cloak
                    class="mt-6 text-sm font-semibold text-[#33415c]"
                >
                    Opening your playlist...
                </p>


                <!-- Error -->
                <p
                    x-show="error"
                    x-text="error"
                    x-cloak
                    class="mt-4 text-red-700"
                ></p>

            </div>

        </section>

    </main>



    <!-- ALPINE.JS LOGIC -->
    <script>
        function welcomeApp() {

            return {

                // Welcome page inputs
                description: '',
                mood: '',
                songCount: 10,

                selectedGenres: [],
                selectedEras: [],

                genreOpen: false,
                eraOpen: false,

                loading: false,
                generated: false,
                visible: false,
                error: '',

                // Slideshow variables
                currentSlide: 0,
                slideTimer: null,
                headerObserver: null,


                // Seven moods
                slides: [

                    {
                        title: 'Happy',
                        caption: 'Bright days, good energy, and songs you can smile to.',
                        alt: 'Sunlit flowers',
                        image: 'https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=1200&q=85',
                        gradient: 'linear-gradient(140deg, #f8c75d, #d87943)'
                    },

                    {
                        title: 'Sad',
                        caption: 'When you need music that understands how you feel.',
                        alt: 'Evening sky',
                        image: 'https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1200&q=85',
                        gradient: 'linear-gradient(140deg, #1f3855, #566b91)'
                    },

                    {
                        title: 'Nostalgic',
                        caption: 'A soundtrack to all the moments you wish you could replay.',
                        alt: 'Concert lights',
                        image: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=1200&q=85',
                        gradient: 'linear-gradient(140deg, #75435d, #b98164)'
                    },

                    {
                        title: 'Chill',
                        caption: 'Slow down, unwind, and take the scenic route.',
                        alt: 'Peaceful mountain scenery',
                        image: 'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=85',
                        gradient: 'linear-gradient(140deg, #3e706a, #789a83)'
                    },

                    {
                        title: 'Party',
                        caption: 'Turn it up and make tonight unforgettable.',
                        alt: 'Colorful music festival',
                        image: 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1200&q=85',
                        gradient: 'linear-gradient(140deg, #7124a4, #e65f8d)'
                    },

                    {
                        title: 'Romantic',
                        caption: 'For butterflies, slow dances, and late-night conversations.',
                        alt: 'Romantic couple',
                        image: 'https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=1200&q=85',
                        gradient: 'linear-gradient(140deg, #b75c67, #dc9e91)'
                    },

                    {
                        title: 'Focused',
                        caption: 'Find your flow and let everything else fade away.',
                        alt: 'Workspace for studying',
                        image: 'https://images.unsplash.com/photo-1434030216411-0b793f4b4173?auto=format&fit=crop&w=1200&q=85',
                        gradient: 'linear-gradient(140deg, #395a69, #81929b)'
                    }

                ],


                // Genre choices
                genreOptions: [
                    'Pop',
                    'Hip-Hop/Rap',
                    'R&B/Soul',
                    'Rock',
                    'Alternative',
                    'Indie',
                    'EDM',
                    'House',
                    'Techno',
                    'Country',
                    'Latin',
                    'Reggaeton',
                    'K-Pop',
                    'J-Pop',
                    'Jazz',
                    'Blues',
                    'Classical',
                    'Metal',
                    'Folk',
                    'Afrobeats'
                ],


                // Era choices
                eraOptions: [
                    '1950s',
                    '1960s',
                    '1970s',
                    '1980s',
                    '1990s',
                    '2000s',
                    '2010s',
                    '2020s'
                ],


                // Backend settings
                demoMode: false,
                apiUrl: 'http://127.0.0.1:8000/items',


                // Initialize slideshow and header
                init() {

                    this.$nextTick(() => {

                        const updateHeaderHeight = () => {

                            document.documentElement.style.setProperty(
                                '--moodmixer-header-height',
                                this.$refs.siteHeader.offsetHeight + 'px'
                            );

                        };

                        updateHeaderHeight();

                        this.headerObserver =
                            new ResizeObserver(updateHeaderHeight);

                        this.headerObserver.observe(
                            this.$refs.siteHeader
                        );

                    });

                    this.startSlideshow();
                },


                // Clean up timer
                destroy() {

                    clearInterval(this.slideTimer);

                    if (this.headerObserver) {
                        this.headerObserver.disconnect();
                    }

                },


                // Start automatic slideshow
                startSlideshow() {

                    clearInterval(this.slideTimer);

                    this.slideTimer = setInterval(() => {

                        this.currentSlide =
                            (this.currentSlide + 1) %
                            this.slides.length;

                    }, 5000);

                },


                // Go to selected slide
                goToSlide(index) {

                    this.currentSlide = index;

                    this.startSlideshow();
                },


                // Previous slide
                previousSlide() {

                    this.goToSlide(
                        (this.currentSlide - 1 + this.slides.length)
                        % this.slides.length
                    );

                },


                // Next slide
                nextSlide() {

                    this.goToSlide(
                        (this.currentSlide + 1) %
                        this.slides.length
                    );

                },


                // Generate Playlist
                async generate() {

                    // Require mood or description
                    if (!this.description.trim() && !this.mood) {

                        this.error =
                            'Please enter a description or select a mood.';

                        return;
                    }

                    this.error = '';
                    this.loading = true;


                    // Playlist preferences
                    const playlistData = {

                        mood: this.mood,

                        description: this.description.trim(),

                        numberOfSongs: Number(this.songCount),

                        candidateCount: Number(this.songCount) + 10,

                        genres: [...this.selectedGenres],

                        eras: [...this.selectedEras]

                    };

                    console.log(
                        'Playlist JSON request:',
                        playlistData
                    );


                    try {

                        // Real backend mode
                        if (!this.demoMode) {

                            const response = await fetch(
                                //this.apiUrl,
                                'http://127.0.0.1:8000/items',
                                {
                                    method: 'POST',

                                    headers: {
                                        'Content-Type': 'application/json'
                                    },

                                    body: JSON.stringify(playlistData)
                                }
                            );

                            if (!response.ok) {

                                throw new Error(
                                    'Backend error: ' + response.status
                                );

                            }

                            const data = await response.json();

                            if (
                                !Array.isArray(data.songs) &&
                                !Array.isArray(data.playlists)
                            ) {

                                throw new Error(
                                    'Backend must return songs or playlists.'
                                );

                            }

                            sessionStorage.setItem(
                                'generatedPlaylist',
                                JSON.stringify(data)
                            );

                        } else {

                            // Local testing
                            sessionStorage.removeItem(
                                'generatedPlaylist'
                            );

                        }


                        // Save selections
                        sessionStorage.setItem(
                            'playlistPreferences',
                            JSON.stringify(playlistData)
                        );

                        this.generated = true;


                        // Go to playlist page after 1 second
                        setTimeout(() => {

                            window.location.href = 'playlist_page.html';

                        }, 1000);


                    } catch (error) {

                        console.error(error);

                        this.error = error.message;

                    } finally {

                        this.loading = false;

                    }

                }

            };

        }
    </script>

</body>
</html>
